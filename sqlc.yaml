# sqlc turns each feature's SQL queries into typed Go code in that
# feature's own package, internal/<feature>/store. Regenerate with
# `make generate` after changing a query or a migration; never edit the
# generated code by hand.
#
# Queries live next to their feature: internal/<feature>/<feature>.sql.
# Write parameters as @name. The first entry holds the shared settings
# (&sqlc); the others reuse them with `<<:` and set only their queries and
# output folder.
# readysetgo:begin template
# (Shared query files are read by both engines, which both accept @name.
# Queries that must differ live in internal/<feature>/<db>/; init flattens
# the chosen database's folder into its feature folder.)
# readysetgo:end
version: "2"
sql:
  # readysetgo:begin db=sqlite
  - &sqlc
    engine: sqlite
    schema: migrations/sqlite
    queries: [internal/auth/auth.sql]
    gen:
      go: &go
        package: store
        out: internal/auth/store
        omit_unused_structs: true
        # SQLite has no UUID type: UUID columns are TEXT, mapped to uuid.UUID
        # here. Name UUID columns `id` or `<thing>_id`. The first matching
        # entry wins, whether or not the column is nullable, so a nullable
        # UUID column (uuid.NullUUID) or a non-UUID `_id` column is listed
        # by name, above the patterns.
        # readysetgo:begin template
        # (This keeps the generated Go identical to the Postgres version.)
        # readysetgo:end
        overrides:
          # readysetgo:begin module=audit
          - column: "audit_events.user_id"
            go_type: github.com/google/uuid.NullUUID
          - column: "audit_events.actor_id"
            go_type: github.com/google/uuid.NullUUID
          - column: "audit_events.request_id"
            go_type: string
          # readysetgo:end
          - column: "*.id"
            go_type: github.com/google/uuid.UUID
          - column: "*.*_id"
            go_type: github.com/google/uuid.UUID
  - <<: *sqlc
    queries: [internal/jobs/jobs.sql, internal/jobs/sqlite/claim.sql]
    gen: {go: {<<: *go, out: internal/jobs/store}}
  # example:begin
  - <<: *sqlc
    queries: [internal/notes/notes.sql]
    gen: {go: {<<: *go, out: internal/notes/store}}
  # example:end
  # readysetgo:begin module=workspaces
  - <<: *sqlc
    queries: [internal/workspaces/workspaces.sql]
    gen: {go: {<<: *go, out: internal/workspaces/store}}
  # readysetgo:end
  # readysetgo:begin module=audit
  - <<: *sqlc
    queries: [internal/audit/audit.sql]
    gen: {go: {<<: *go, out: internal/audit/store}}
  # readysetgo:end
  # readysetgo:begin module=admin
  - <<: *sqlc
    queries: [internal/admin/admin.sql]
    gen: {go: {<<: *go, out: internal/admin/store}}
  # readysetgo:end
  # readysetgo:begin module=uploads
  - <<: *sqlc
    queries: [internal/uploads/uploads.sql]
    gen: {go: {<<: *go, out: internal/uploads/store}}
  # readysetgo:end
  # readysetgo:begin module=metrics
  - <<: *sqlc
    queries: [internal/metrics/metrics.sql]
    gen: {go: {<<: *go, out: internal/metrics/store}}
  # readysetgo:end
  # readysetgo:begin module=twofactor
  - <<: *sqlc
    queries: [internal/twofactor/twofactor.sql]
    gen: {go: {<<: *go, out: internal/twofactor/store}}
  # readysetgo:end
  # readysetgo:begin module=social
  - <<: *sqlc
    queries: [internal/social/social.sql]
    gen: {go: {<<: *go, out: internal/social/store}}
  # readysetgo:end
  # readysetgo:end
  # readysetgo:begin db=postgres
  - &sqlc
    engine: postgresql
    schema: migrations/postgres
    queries: [internal/auth/auth.sql]
    gen:
      go: &go
        package: store
        out: internal/auth/store/postgres
        omit_unused_structs: true
  - <<: *sqlc
    queries: [internal/jobs/jobs.sql, internal/jobs/postgres/claim.sql]
    gen: {go: {<<: *go, out: internal/jobs/store/postgres}}
  # example:begin
  - <<: *sqlc
    queries: [internal/notes/notes.sql]
    gen: {go: {<<: *go, out: internal/notes/store/postgres}}
  # example:end
  # readysetgo:begin module=workspaces
  - <<: *sqlc
    queries: [internal/workspaces/workspaces.sql]
    gen: {go: {<<: *go, out: internal/workspaces/store/postgres}}
  # readysetgo:end
  # readysetgo:begin module=audit
  - <<: *sqlc
    queries: [internal/audit/audit.sql]
    gen: {go: {<<: *go, out: internal/audit/store/postgres}}
  # readysetgo:end
  # readysetgo:begin module=admin
  - <<: *sqlc
    queries: [internal/admin/admin.sql]
    gen: {go: {<<: *go, out: internal/admin/store/postgres}}
  # readysetgo:end
  # readysetgo:begin module=uploads
  - <<: *sqlc
    queries: [internal/uploads/uploads.sql]
    gen: {go: {<<: *go, out: internal/uploads/store/postgres}}
  # readysetgo:end
  # readysetgo:begin module=metrics
  - <<: *sqlc
    queries: [internal/metrics/metrics.sql]
    gen: {go: {<<: *go, out: internal/metrics/store/postgres}}
  # readysetgo:end
  # readysetgo:begin module=twofactor
  - <<: *sqlc
    queries: [internal/twofactor/twofactor.sql]
    gen: {go: {<<: *go, out: internal/twofactor/store/postgres}}
  # readysetgo:end
  # readysetgo:begin module=social
  - <<: *sqlc
    queries: [internal/social/social.sql]
    gen: {go: {<<: *go, out: internal/social/store/postgres}}
  # readysetgo:end
  # readysetgo:end
