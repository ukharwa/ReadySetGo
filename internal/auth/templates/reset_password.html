{{define "title"}}Choose a new password{{end}}

{{define "content"}}
<h1>Choose a new password</h1>
{{with .Data.Error}}
  <p class="error-summary" role="alert">{{.}}</p>
  <p><a href="/forgot-password">Send a new link</a></p>
{{else}}
<form method="post" action="/reset-password" class="stack">
  <input type="hidden" name="token" value="{{.Data.Token}}">
  <label>New password
    <input type="password" name="password" autocomplete="new-password" required autofocus>
    {{with .Data.Form.Errors.password}}<span class="field-error">{{.}}</span>{{end}}
  </label>
  <button type="submit">Set password</button>
</form>
{{end}}
{{end}}
