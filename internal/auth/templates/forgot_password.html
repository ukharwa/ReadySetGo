{{define "title"}}Reset your password{{end}}

{{define "content"}}
<h1>Reset your password</h1>
<p>Enter your account's email address and we'll send you a link to choose a new password.</p>
<form method="post" action="/forgot-password" class="stack">
  <label>Email
    <input type="email" name="email" value="{{.Data.Form.Get "email"}}" autocomplete="email" required autofocus>
    {{with .Data.Form.Errors.email}}<span class="field-error">{{.}}</span>{{end}}
  </label>
  <button type="submit">Send the link</button>
</form>
{{end}}
