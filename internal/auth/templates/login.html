{{define "title"}}Log in{{end}}

{{define "content"}}
<h1>Log in</h1>
{{with .Data.Error}}<p class="error-summary" role="alert">{{.}}</p>{{end}}
<form method="post" action="/login" class="stack">
  <input type="hidden" name="next" value="{{.Data.Next}}">
  <label>Email
    <input type="email" name="email" value="{{.Data.Form.Get "email"}}" autocomplete="email" required autofocus>
  </label>
  <label>Password
    <input type="password" name="password" autocomplete="current-password" required>
  </label>
  <label class="check"><input type="checkbox" name="remember" value="1"> Keep me logged in for 30 days</label>
  <button type="submit">Log in</button>
</form>
<!-- readysetgo:begin module=social -->
{{range .Providers}}
<p><a href="/auth/{{.ID}}{{with $.Data.Next}}?next={{.}}{{end}}" class="button secondary" data-time-zone>Continue with {{.Name}}</a></p>
{{end}}
<!-- readysetgo:end -->
<p><a href="/forgot-password">Forgotten your password?</a>{{if .OpenSignup}} · <a href="/register{{with .Data.Next}}?next={{.}}{{end}}">Create an account</a>{{end}}</p>
{{end}}
