# Services for local development. The app itself runs on your machine with
# `make run`; these are what it talks to. Start them with `make services`.
# Host ports can be changed in .env when another project's services already
# use them.
name: readysetgo-dev

services:
  # Catches every email the app sends; read them at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025" # web inbox

  # readysetgo:begin db=postgres
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: readysetgo
      POSTGRES_PASSWORD: readysetgo
      POSTGRES_DB: readysetgo
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readysetgo -d readysetgo"]
      interval: 2s
      timeout: 5s
      retries: 15
  # readysetgo:end

# readysetgo:begin db=postgres
volumes:
  postgres:
# readysetgo:end
