# Checks every combination of options `make init` can produce. Each job
# copies the repository, runs init with its options in the copy, then checks
# the result like a new project: tidy, vet, the tests, lint, sqlc, and a scan
# for anything left over from options that weren't chosen. See
# tools/kickstart/check.go; `make template-check DB=… UI=…` runs one locally.
#
# This workflow belongs to the template only: make init deletes it.
name: Template

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  combinations:
    name: db=${{ matrix.db }} ui=${{ matrix.ui }} modules=${{ matrix.modules }}
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
        ui: [html, api]
        modules: [none, all]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-only: true
      - uses: sqlc-dev/setup-sqlc@bac53b7fb28c039a6c7f5736fd1e89744021bdd6 # v5.0.0
        with:
          sqlc-version: "1.31.1"
      - name: Init and check
        run: go run ./tools/kickstart check -db ${{ matrix.db }} -ui ${{ matrix.ui }} -modules ${{ matrix.modules }}
