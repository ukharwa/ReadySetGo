# Weekly pull requests for newer Go modules, GitHub Actions and container
# images, one per kind. A release must be a week old before it's proposed,
# so a compromised or broken release has time to be noticed and pulled.
#
# Not covered: the Go version (go.mod's go line and the golang image in the
# Dockerfile) and the dev tools pinned in the Makefile. Bump those by hand.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go-modules:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dockerfile:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      compose:
        patterns: ["*"]
